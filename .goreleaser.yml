version: 2

# This repository (aws-tui) hosts multiple AWS TUI tools. Each tool has its
# own build/archive/cask entry keyed by id; all tools are released together
# under a single tag.
project_name: aws-tui
env:
  - GO111MODULE=on
before:
  hooks:
    - go mod tidy
builds:
  - id: aws-parameter-store-tui
    main: ./cmd/aws-parameter-store-tui
    binary: aws-parameter-store-tui
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
      - -X main.Revision={{.ShortCommit}}
    env:
      - CGO_ENABLED=0
    ignore:
      - goos: windows
        goarch: "386"
      - goos: darwin
        goarch: "386"
      - goos: linux
        goarch: "386"
      - goos: linux
        goarch: arm
        goarm: "7"
  - id: aws-secrets-manager-tui
    main: ./cmd/aws-secrets-manager-tui
    binary: aws-secrets-manager-tui
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
      - -X main.Revision={{.ShortCommit}}
    env:
      - CGO_ENABLED=0
    ignore:
      - goos: windows
        goarch: "386"
      - goos: darwin
        goarch: "386"
      - goos: linux
        goarch: "386"
      - goos: linux
        goarch: arm
        goarm: "7"
  - id: aws-ecs-tui
    main: ./cmd/aws-ecs-tui
    binary: aws-ecs-tui
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
      - -X main.Revision={{.ShortCommit}}
    env:
      - CGO_ENABLED=0
    ignore:
      - goos: windows
        goarch: "386"
      - goos: darwin
        goarch: "386"
      - goos: linux
        goarch: "386"
      - goos: linux
        goarch: arm
        goarm: "7"
  - id: aws-security-group-tui
    main: ./cmd/aws-security-group-tui
    binary: aws-security-group-tui
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
      - -X main.Revision={{.ShortCommit}}
    env:
      - CGO_ENABLED=0
    ignore:
      - goos: windows
        goarch: "386"
      - goos: darwin
        goarch: "386"
      - goos: linux
        goarch: "386"
      - goos: linux
        goarch: arm
        goarm: "7"
  - id: aws-ec2-tui
    main: ./cmd/aws-ec2-tui
    binary: aws-ec2-tui
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
      - -X main.Revision={{.ShortCommit}}
    env:
      - CGO_ENABLED=0
    ignore:
      - goos: windows
        goarch: "386"
      - goos: darwin
        goarch: "386"
      - goos: linux
        goarch: "386"
      - goos: linux
        goarch: arm
        goarm: "7"
  - id: aws-route53-tui
    main: ./cmd/aws-route53-tui
    binary: aws-route53-tui
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
      - -X main.Revision={{.ShortCommit}}
    env:
      - CGO_ENABLED=0
    ignore:
      - goos: windows
        goarch: "386"
      - goos: darwin
        goarch: "386"
      - goos: linux
        goarch: "386"
      - goos: linux
        goarch: arm
        goarm: "7"
  - id: aws-cloudwatch-logs-tui
    main: ./cmd/aws-cloudwatch-logs-tui
    binary: aws-cloudwatch-logs-tui
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
      - -X main.Revision={{.ShortCommit}}
    env:
      - CGO_ENABLED=0
    ignore:
      - goos: windows
        goarch: "386"
      - goos: darwin
        goarch: "386"
      - goos: linux
        goarch: "386"
      - goos: linux
        goarch: arm
        goarm: "7"
archives:
  - id: aws-parameter-store-tui
    ids:
      - aws-parameter-store-tui
    name_template: >-
      aws-parameter-store-tui_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - README.md
      - LICENSE
      - CREDITS
  - id: aws-secrets-manager-tui
    ids:
      - aws-secrets-manager-tui
    name_template: >-
      aws-secrets-manager-tui_
      {{- title .Os }}_
